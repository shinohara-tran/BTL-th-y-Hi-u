# Bộ dữ liệu của nhóm Topic 3 (thay cho 10 công ty công nghệ của repo gốc).
# Danh sách gốc vẫn giữ ở config/companies_original.yaml.
#
# Chọn 3 công ty ở 3 ngành khác hẳn nhau để kiểm tra xem kết luận của bài báo
# có còn đúng ngoài ngành công nghệ không:
#   VFS  - VinFast: công ty Việt Nam niêm yết ở Mỹ, nộp 20-F (mẫu cho công ty nước ngoài)
#   LLY  - Eli Lilly: dược phẩm, nhiều tên thuốc và hoạt chất hiếm (hợp để thử BM25 vs Dense)
#   JPM  - JPMorgan Chase: ngân hàng, thuật ngữ vốn và quản trị rủi ro (CET1, Basel III...)
#
# Lưu ý: chỉ lấy 10-K / 20-F để index nhanh. Muốn thêm 10-Q thì thêm "10-Q" vào forms.
# 6-K của VinFast phần lớn là trang bìa, nội dung nằm ở phụ lục EX-99 mà repo không tải,
# nên tạm không lấy.

companies:
  - ticker: "VFS"
    name: "VinFast Auto Ltd."
    cik: "0001913510"
    sector: "Electric Vehicles"
    geography: "Vietnam"
    forms: ["20-F"]

  - ticker: "LLY"
    name: "Eli Lilly and Company"
    cik: "0000059478"
    sector: "Pharmaceuticals"
    geography: "US"
    forms: ["10-K"]

  - ticker: "JPM"
    name: "JPMorgan Chase & Co."
    cik: "0000019617"
    sector: "Banking"
    geography: "US"
    forms: ["10-K"]
