# Bộ câu hỏi chung của nhóm Topic 3.
#
# BẢN NHÁP: các câu dưới đây được viết theo các chủ đề thường có trong báo cáo của
# 3 công ty, CHƯA ai kiểm tra trong báo cáo thật. Trước khi chốt, mỗi câu phải có
# ít nhất một đoạn trả lời được trong dữ liệu đã index; câu nào không có thì sửa hoặc xóa.
# Mục tiêu: khoảng 100 câu (hiện có 24).
#
# Trường:
#   id                mã câu, không trùng
#   query             câu hỏi đúng như người dùng gõ
#   category          một trong:
#                       exact_code   mã, số hiệu, tên chuẩn mực (BM25 nên mạnh)
#                       semantic     hỏi theo ý, không trùng chữ với văn bản (Dense nên mạnh)
#                       hybrid       vừa có tên riêng vừa có ý
#                       rare_term    thuật ngữ hiếm
#                       long         câu dài, nhiều vế
#                       company      có nhắc tên công ty (cho Phần 3)
#                       numeric_year hỏi con số theo năm (cho Phần 1 và Phần 4)
#   expected_tickers  câu trả lời đúng phải thuộc công ty nào; để [] nếu công ty nào cũng được
#   split             dev = dùng để chỉnh tham số; test = chỉ chạy lần cuối. Khoảng 30% dev.
#   note              ghi chú tùy ý

queries:
  # ---------- Eli Lilly (LLY) ----------
  - id: q001
    query: "340B Drug Pricing Program contract pharmacy"
    category: exact_code
    expected_tickers: [LLY]
    split: dev
  - id: q002
    query: "tirzepatide"
    category: rare_term
    expected_tickers: [LLY]
    split: test
  - id: q003
    query: "risk that the company cannot make enough of its most popular medicines to meet demand"
    category: semantic
    expected_tickers: [LLY]
    split: test
  - id: q004
    query: "Mounjaro revenue in 2024"
    category: numeric_year
    expected_tickers: [LLY]
    split: dev
  - id: q005
    query: "How does Eli Lilly describe competition from compounded versions of its medicines?"
    category: company
    expected_tickers: [LLY]
    split: test
  - id: q006
    query: "What does the company say about government negotiation of drug prices and its expected effect on future revenue?"
    category: long
    expected_tickers: [LLY]
    split: test
  - id: q007
    query: "Inflation Reduction Act Medicare price negotiation"
    category: hybrid
    expected_tickers: [LLY]
    split: test

